[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "comfy-omg"
version = "0.1.0"
description = "Local-first Ollama creative intelligence and multimodal workflow nodes for ComfyUI"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dynamic = ["dependencies"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: AMD ROCm",
    "Environment :: GPU :: Apple Metal",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
video = ["opencv-python>=4.8.0"]
web-search = ["ddgs>=9.0.0", "smolagents[toolkit]>=1.26.0"]
all = [
    "opencv-python>=4.8.0",
    "ddgs>=9.0.0",
    "smolagents[toolkit]>=1.26.0",
]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "pip-audit>=2.9",
    "pytest>=8.3",
    "pytest-cov>=5",
    "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/RYG81/Comfy-OMG"
Documentation = "https://github.com/RYG81/Comfy-OMG#readme"
"Bug Tracker" = "https://github.com/RYG81/Comfy-OMG/issues"

[tool.setuptools]
py-modules = ["ollama_client"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodes*", "prompts*", "tasks*", "utils*"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.comfy]
PublisherId = "RYG81"
DisplayName = "ComfyUI-OMG"
requires-comfyui = ">=0.3.0"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = [".git", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
